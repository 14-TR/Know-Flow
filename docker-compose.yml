version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: knowflow-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATA_DIR: /app/data
      ADMIN_DATA_DIR: /app/admin-templates
      KNOWFLOW_USER: ${KNOWFLOW_USER:-admin}
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./database:/app/database
      - ${DATA_DIR:-./data}:/app/data
      - ${ADMIN_DATA_DIR:-./data/admin}:/app/admin-templates:ro

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: knowflow-client
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./client:/app
      - /app/node_modules
